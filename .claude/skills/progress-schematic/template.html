<title>Dona Dom Foundation Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --paper: #eef1ee;
    --surface: #ffffff;
    --inset: #f0f3f1;
    --ink: #16241f;
    --muted: #5b6b65;
    --teal: #0e5b4e;
    --teal-soft: #dfece7;
    --ochre: #a2650c;
    --ochre-soft: #f8eeda;
    --tab-ink: #ffffff;
    --dashline: #a3b1ab;
    --dots: #cdd7d2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101a18;
      --surface: #18241f;
      --inset: #121d1a;
      --ink: #e8f0ec;
      --muted: #9aaea7;
      --teal: #4fb3a0;
      --teal-soft: #16332d;
      --ochre: #d9a04a;
      --ochre-soft: #33270f;
      --tab-ink: #22190a;
      --dashline: #4a5a54;
      --dots: #23322d;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101a18;
    --surface: #18241f;
    --inset: #121d1a;
    --ink: #e8f0ec;
    --muted: #9aaea7;
    --teal: #4fb3a0;
    --teal-soft: #16332d;
    --ochre: #d9a04a;
    --ochre-soft: #33270f;
    --tab-ink: #22190a;
    --dashline: #4a5a54;
    --dots: #23322d;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    margin: 0;
    padding: 2rem 1.25rem 3rem;
  }
  figure { margin: 0 auto; max-width: 1040px; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 780px; height: auto; }
  figcaption {
    max-width: 1040px;
    margin: 1.1rem auto 0;
    color: var(--muted);
    font-size: 0.86rem;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: 0.01em;
  }
  @media (max-width: 800px) {
    figcaption::before { content: 'scroll to see the full drawing → '; color: var(--ochre); }
  }

  .t-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; fill: var(--muted); }
  .t-eyebrow-hi { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; fill: var(--ochre); }
  .t-title { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 25px; font-weight: 600; fill: var(--ink); }
  .t-box { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 19px; font-weight: 600; fill: var(--ink); }
  .t-box-dim { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 19px; font-weight: 600; fill: var(--muted); }
  .t-sub { font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; fill: var(--muted); }
  .t-mono { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; fill: var(--muted); }
  .t-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; fill: var(--teal); }
  .t-tab { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; fill: var(--tab-ink); }
  .t-stat { font-family: 'IBM Plex Mono', monospace; font-size: 27px; font-weight: 500; fill: var(--teal); }
  .t-glyph { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 19px; font-weight: 600; fill: var(--ochre); }

  .card { fill: var(--surface); stroke: var(--ochre); stroke-width: 2; }
  .gate { fill: var(--ochre-soft); stroke: var(--ochre); stroke-width: 2; }
  .tab { fill: var(--ochre); }
  .badge { fill: var(--ochre-soft); }
  .inset { fill: var(--inset); }
  .built { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 1.5; }
  .future { fill: none; stroke: var(--dashline); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .wire { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  .bus { stroke: var(--ink); stroke-width: 2; opacity: 0.55; }
  .rule { stroke: var(--dashline); stroke-width: 1; }
  .plate { fill: var(--paper); }
  .glyphline { stroke: var(--ochre); stroke-width: 1.8; stroke-linecap: round; }
  .clockface { fill: none; stroke: var(--ochre); stroke-width: 1.8; }
</style>

<figure>
  <div class="scroll">
    <svg viewBox="0 0 1040 830" role="img"
      aria-label="Foundation plan at end of day 3: blueprints, the records vault and the kernel primitives now stand; today added three durability guarantees — never twice, always recorded, never forgotten — plus a gate that blocks any change failing typecheck, lint, 40 tests or 3 golden cases; only a green gate deploys to day four's staging and production.">
      <defs>
        <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <polygon points="0,0 10,5 0,10" fill="var(--muted)"/>
        </marker>
        <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="1" fill="var(--dots)"/>
        </pattern>
      </defs>

      <rect x="0" y="0" width="1040" height="830" fill="url(#grid)"/>

      <!-- header -->
      <text class="t-eyebrow" x="40" y="34">DONA DOM · TENANCY OS · WEEK 1</text>
      <text class="t-title" x="40" y="64">Foundation plan — end of day 3</text>

      <rect class="built" x="700" y="24" width="13" height="13" rx="2"/>
      <text class="t-mono" x="721" y="35">standing</text>
      <rect x="790" y="24" width="13" height="13" rx="2" fill="var(--surface)" stroke="var(--ochre)" stroke-width="2"/>
      <text class="t-mono" x="811" y="35">added today</text>
      <rect class="future" x="908" y="24" width="13" height="13" rx="2"/>
      <text class="t-mono" x="929" y="35">next</text>

      <!-- NEXT band: day 4 -->
      <text class="t-eyebrow" x="40" y="96">NEXT — DAY 4</text>

      <rect class="future" x="40" y="108" width="470" height="97" rx="8"/>
      <text class="t-box-dim" x="64" y="147">Staging, automatic</text>
      <text class="t-sub" x="64" y="172">merge a change and it deploys itself, migrations included</text>

      <rect class="future" x="530" y="108" width="470" height="97" rx="8"/>
      <text class="t-box-dim" x="554" y="147">Production on a tag</text>
      <text class="t-sub" x="554" y="172">with a one-command rollback, rehearsed on purpose</text>

      <!-- the gate is the only way up -->
      <line class="wire" x1="275" y1="232" x2="275" y2="211" marker-end="url(#up)"/>
      <line class="wire" x1="765" y1="232" x2="765" y2="211" marker-end="url(#up)"/>
      <line class="wire" x1="275" y1="232" x2="765" y2="232"/>
      <line class="wire" x1="520" y1="250" x2="520" y2="232"/>
      <text class="t-eyebrow-hi" x="40" y="236">ONLY A GREEN GATE DEPLOYS</text>

      <!-- THE GATE -->
      <rect class="gate" x="40" y="250" width="960" height="80" rx="10"/>
      <rect class="tab" x="58" y="239" width="112" height="21" rx="5"/>
      <text class="t-tab" x="70" y="254">ADDED TODAY</text>
      <text class="t-box" x="64" y="294">The gate</text>
      <text class="t-sub" x="64" y="316">nothing reaches the main line without passing</text>
      <text class="t-mono" x="976" y="290" text-anchor="end">typecheck · lint · 40 tests · 3 golden cases</text>
      <text class="t-mono" x="976" y="310" text-anchor="end">proven: PR #2 broke one test on purpose → merge blocked</text>

      <!-- today's three pass through the gate -->
      <line class="wire" x1="193" y1="372" x2="193" y2="336" marker-end="url(#up)"/>
      <line class="wire" x1="520" y1="372" x2="520" y2="336" marker-end="url(#up)"/>
      <line class="wire" x1="847" y1="372" x2="847" y2="336" marker-end="url(#up)"/>

      <!-- TODAY: card 1 -->
      <rect class="card" x="40" y="372" width="306" height="184" rx="10"/>
      <rect class="tab" x="58" y="361" width="112" height="21" rx="5"/>
      <text class="t-tab" x="70" y="376">ADDED TODAY</text>
      <circle class="badge" cx="86" cy="428" r="22"/>
      <text class="t-glyph" x="86" y="428" text-anchor="middle" dominant-baseline="central">1×</text>
      <text class="t-box" x="122" y="435">Never twice</text>
      <text class="t-sub" x="64" y="470">A repeated request returns the first</text>
      <text class="t-sub" x="64" y="488">answer — never a second booking.</text>
      <rect class="inset" x="64" y="500" width="258" height="42" rx="6"/>
      <text class="t-mono" x="76" y="517">retry → the first result</text>
      <text class="t-mono" x="76" y="533">still running → conflict</text>

      <!-- TODAY: card 2 -->
      <rect class="card" x="367" y="372" width="306" height="184" rx="10"/>
      <rect class="tab" x="385" y="361" width="112" height="21" rx="5"/>
      <text class="t-tab" x="397" y="376">ADDED TODAY</text>
      <circle class="badge" cx="413" cy="428" r="22"/>
      <line class="glyphline" x1="404" y1="422" x2="422" y2="422"/>
      <line class="glyphline" x1="404" y1="428" x2="422" y2="428"/>
      <line class="glyphline" x1="404" y1="434" x2="416" y2="434"/>
      <text class="t-box" x="449" y="435">Always recorded</text>
      <text class="t-sub" x="391" y="470">Every command writes who did what,</text>
      <text class="t-sub" x="391" y="488">and how it ended.</text>
      <rect class="inset" x="391" y="500" width="258" height="42" rx="6"/>
      <text class="t-mono" x="403" y="517">actor · action · inputs</text>
      <text class="t-mono" x="403" y="533">outcome — failures too</text>

      <!-- TODAY: card 3 -->
      <rect class="card" x="694" y="372" width="306" height="184" rx="10"/>
      <rect class="tab" x="712" y="361" width="112" height="21" rx="5"/>
      <text class="t-tab" x="724" y="376">ADDED TODAY</text>
      <circle class="badge" cx="740" cy="428" r="22"/>
      <circle class="clockface" cx="740" cy="428" r="10"/>
      <line class="clockface" x1="740" y1="428" x2="740" y2="421"/>
      <line class="clockface" x1="740" y1="428" x2="745" y2="431"/>
      <text class="t-box" x="776" y="435">Never forgotten</text>
      <text class="t-sub" x="718" y="470">Deadlines and follow-ups resume</text>
      <text class="t-sub" x="718" y="488">after a crash or a restart.</text>
      <rect class="inset" x="718" y="500" width="258" height="42" rx="6"/>
      <text class="t-mono" x="730" y="517">restart → work resumes</text>
      <text class="t-mono" x="730" y="533">two runners → one winner</text>

      <!-- stands on -->
      <line class="wire" x1="193" y1="584" x2="193" y2="562" marker-end="url(#up)"/>
      <line class="wire" x1="520" y1="584" x2="520" y2="562" marker-end="url(#up)"/>
      <line class="wire" x1="847" y1="584" x2="847" y2="562" marker-end="url(#up)"/>
      <line class="bus" x1="120" y1="584" x2="920" y2="584"/>
      <text class="t-eyebrow" x="40" y="588">STANDS ON</text>
      <line class="wire" x1="193" y1="620" x2="193" y2="584"/>
      <line class="wire" x1="520" y1="620" x2="520" y2="584"/>
      <line class="wire" x1="847" y1="620" x2="847" y2="584"/>

      <!-- FOUNDATION -->
      <rect class="built" x="40" y="620" width="306" height="90" rx="8"/>
      <text class="t-box" x="64" y="657">Blueprints</text>
      <text class="t-sub" x="64" y="680">written specs, rules, boundaries</text>
      <text class="t-tag" x="322" y="644" text-anchor="end">DAY 1</text>

      <rect class="built" x="367" y="620" width="306" height="90" rx="8"/>
      <text class="t-box" x="391" y="657">Records vault</text>
      <text class="t-sub" x="391" y="680">Postgres, versioned, health-checked</text>
      <text class="t-tag" x="649" y="644" text-anchor="end">DAY 2</text>

      <rect class="built" x="694" y="620" width="306" height="90" rx="8"/>
      <text class="t-box" x="718" y="657">Kernel primitives</text>
      <text class="t-sub" x="718" y="680">one error language · numbers · clock</text>
      <text class="t-tag" x="976" y="644" text-anchor="end">DAY 2</text>

      <!-- proof strip -->
      <line class="rule" x1="40" y1="750" x2="1000" y2="750"/>
      <text class="t-stat" x="40" y="788">40/40</text>
      <text class="t-mono" x="128" y="780">checks green,</text>
      <text class="t-mono" x="128" y="794">none skipped</text>

      <text class="t-stat" x="367" y="788">27s</text>
      <text class="t-mono" x="422" y="780">for the full gate</text>
      <text class="t-mono" x="422" y="794">to run in CI</text>

      <text class="t-stat" x="694" y="788">#2</text>
      <text class="t-mono" x="738" y="780">the pull request</text>
      <text class="t-mono" x="738" y="794">blocked on purpose</text>
    </svg>
  </div>
  <figcaption>Days 1–3 · still nothing tenant-facing — day 4 puts this on a real URL.</figcaption>
</figure>
