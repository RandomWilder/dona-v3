<title>Dona Dom Foundation Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --paper: #eef1ee;
    --surface: #ffffff;
    --inset: #f0f3f1;
    --ink: #16241f;
    --muted: #5b6b65;
    --teal: #0e5b4e;
    --teal-soft: #dfece7;
    --ochre: #a2650c;
    --ochre-soft: #f8eeda;
    --tab-ink: #ffffff;
    --dashline: #a3b1ab;
    --dots: #cdd7d2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101a18;
      --surface: #18241f;
      --inset: #121d1a;
      --ink: #e8f0ec;
      --muted: #9aaea7;
      --teal: #4fb3a0;
      --teal-soft: #16332d;
      --ochre: #d9a04a;
      --ochre-soft: #33270f;
      --tab-ink: #22190a;
      --dashline: #4a5a54;
      --dots: #23322d;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101a18;
    --surface: #18241f;
    --inset: #121d1a;
    --ink: #e8f0ec;
    --muted: #9aaea7;
    --teal: #4fb3a0;
    --teal-soft: #16332d;
    --ochre: #d9a04a;
    --ochre-soft: #33270f;
    --tab-ink: #22190a;
    --dashline: #4a5a54;
    --dots: #23322d;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    margin: 0;
    padding: 2rem 1.25rem 3rem;
  }
  figure { margin: 0 auto; max-width: 1040px; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 780px; height: auto; }
  figcaption {
    max-width: 1040px;
    margin: 1.1rem auto 0;
    color: var(--muted);
    font-size: 0.86rem;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: 0.01em;
  }
  @media (max-width: 800px) {
    figcaption::before { content: 'scroll to see the full drawing → '; color: var(--ochre); }
  }

  /* --- drawing type --- */
  .t-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.16em; fill: var(--muted); }
  .t-title { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 25px; font-weight: 600; fill: var(--ink); }
  .t-box { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 19px; font-weight: 600; fill: var(--ink); }
  .t-box-dim { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 19px; font-weight: 600; fill: var(--muted); }
  .t-sub { font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; fill: var(--muted); }
  .t-mono { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; fill: var(--muted); }
  .t-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; fill: var(--teal); }
  .t-tab { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; fill: var(--tab-ink); }
  .t-stat { font-family: 'IBM Plex Mono', monospace; font-size: 27px; font-weight: 500; fill: var(--teal); }
  .t-glyph { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 21px; font-weight: 600; fill: var(--ochre); }
  .t-glyph-sm { font-family: 'IBM Plex Sans Condensed', sans-serif; font-size: 12px; font-weight: 600; fill: var(--ochre); }

  /* --- drawing shapes --- */
  .card { fill: var(--surface); stroke: var(--ochre); stroke-width: 2; }
  .tab { fill: var(--ochre); }
  .badge { fill: var(--ochre-soft); }
  .badge-sm { fill: var(--ochre-soft); stroke: var(--ochre); stroke-width: 1; }
  .inset { fill: var(--inset); }
  .built { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 1.5; }
  .future { fill: none; stroke: var(--dashline); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .wire { stroke: var(--muted); stroke-width: 1.5; fill: none; }
  .bus { stroke: var(--ink); stroke-width: 2; opacity: 0.55; }
  .rule { stroke: var(--dashline); stroke-width: 1; }
  .plate { fill: var(--paper); }
  .clockface { fill: none; stroke: var(--ochre); stroke-width: 1.6; }
</style>

<figure>
  <div class="scroll">
    <svg viewBox="0 0 1040 772" role="img"
      aria-label="Foundation plan: a records vault and written guardrails support three new kernel primitives added today — one error language, one number per record, and a controlled clock — which in turn feed the next layer of retry-safe actions, an audit trail, and deadlines that survive restarts.">
      <defs>
        <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <polygon points="0,0 10,5 0,10" fill="var(--muted)"/>
        </marker>
        <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="1" fill="var(--dots)"/>
        </pattern>
      </defs>

      <rect x="0" y="0" width="1040" height="772" fill="url(#grid)"/>

      <!-- header -->
      <text class="t-eyebrow" x="40" y="34">DONA DOM · TENANCY OS · WEEK 1</text>
      <text class="t-title" x="40" y="64">Foundation plan — end of day 2</text>

      <rect class="built" x="700" y="24" width="13" height="13" rx="2"/>
      <text class="t-mono" x="721" y="35">standing</text>
      <rect x="790" y="24" width="13" height="13" rx="2" fill="var(--surface)" stroke="var(--ochre)" stroke-width="2"/>
      <text class="t-mono" x="811" y="35">added today</text>
      <rect class="future" x="908" y="24" width="13" height="13" rx="2"/>
      <text class="t-mono" x="929" y="35">next</text>

      <!-- NEXT band -->
      <text class="t-eyebrow" x="40" y="100">NEXT — DAY 3</text>

      <rect class="future" x="40" y="112" width="306" height="106" rx="8"/>
      <text class="t-box-dim" x="64" y="149">Retry-safe actions</text>
      <text class="t-sub" x="64" y="172">a repeated request can’t double-book</text>
      <text class="t-mono" x="64" y="200">USES</text>
      <circle class="badge-sm" cx="112" cy="196" r="11"/>
      <text class="t-glyph-sm" x="112" y="196" text-anchor="middle" dominant-baseline="central">!</text>
      <circle class="badge-sm" cx="140" cy="196" r="11"/>
      <text class="t-glyph-sm" x="140" y="196" text-anchor="middle" dominant-baseline="central">#</text>

      <rect class="future" x="367" y="112" width="306" height="106" rx="8"/>
      <text class="t-box-dim" x="391" y="149">Audit trail</text>
      <text class="t-sub" x="391" y="172">who did what, to what, and when</text>
      <text class="t-mono" x="391" y="200">USES</text>
      <circle class="badge-sm" cx="439" cy="196" r="11"/>
      <text class="t-glyph-sm" x="439" y="196" text-anchor="middle" dominant-baseline="central">#</text>
      <circle class="badge-sm" cx="467" cy="196" r="11"/>
      <circle class="clockface" cx="467" cy="196" r="5.5"/>
      <line class="clockface" x1="467" y1="196" x2="467" y2="192.5"/>
      <line class="clockface" x1="467" y1="196" x2="469.5" y2="197.5"/>

      <rect class="future" x="694" y="112" width="306" height="106" rx="8"/>
      <text class="t-box-dim" x="718" y="149">Deadlines that hold</text>
      <text class="t-sub" x="718" y="172">timers keep running after a restart</text>
      <text class="t-mono" x="718" y="200">USES</text>
      <circle class="badge-sm" cx="766" cy="196" r="11"/>
      <circle class="clockface" cx="766" cy="196" r="5.5"/>
      <line class="clockface" x1="766" y1="196" x2="766" y2="192.5"/>
      <line class="clockface" x1="766" y1="196" x2="768.5" y2="197.5"/>
      <circle class="badge-sm" cx="794" cy="196" r="11"/>
      <text class="t-glyph-sm" x="794" y="196" text-anchor="middle" dominant-baseline="central">#</text>

      <!-- upper bus: today's three feed everything above -->
      <line class="wire" x1="193" y1="262" x2="193" y2="224" marker-end="url(#up)"/>
      <line class="wire" x1="520" y1="262" x2="520" y2="224" marker-end="url(#up)"/>
      <line class="wire" x1="847" y1="262" x2="847" y2="224" marker-end="url(#up)"/>
      <line class="bus" x1="120" y1="262" x2="920" y2="262"/>
      <rect class="plate" x="356" y="250" width="330" height="24"/>
      <text class="t-mono" x="521" y="266" text-anchor="middle">EVERY FUTURE MODULE DRAWS FROM THESE</text>
      <line class="wire" x1="193" y1="326" x2="193" y2="262"/>
      <line class="wire" x1="520" y1="326" x2="520" y2="262"/>
      <line class="wire" x1="847" y1="326" x2="847" y2="262"/>

      <!-- TODAY: card 1 -->
      <rect class="card" x="40" y="326" width="306" height="184" rx="10"/>
      <rect class="tab" x="58" y="315" width="112" height="21" rx="5"/>
      <text class="t-tab" x="70" y="330">ADDED TODAY</text>
      <circle class="badge" cx="86" cy="382" r="22"/>
      <text class="t-glyph" x="86" y="382" text-anchor="middle" dominant-baseline="central">!</text>
      <text class="t-box" x="122" y="389">One error language</text>
      <text class="t-sub" x="64" y="424">Every part reports trouble in the</text>
      <text class="t-sub" x="64" y="442">same five words — and only those.</text>
      <rect class="inset" x="64" y="454" width="258" height="42" rx="6"/>
      <text class="t-mono" x="76" y="471">not found · not allowed · taken</text>
      <text class="t-mono" x="76" y="487">invalid · temporarily down</text>

      <!-- TODAY: card 2 -->
      <rect class="card" x="367" y="326" width="306" height="184" rx="10"/>
      <rect class="tab" x="385" y="315" width="112" height="21" rx="5"/>
      <text class="t-tab" x="397" y="330">ADDED TODAY</text>
      <circle class="badge" cx="413" cy="382" r="22"/>
      <text class="t-glyph" x="413" y="382" text-anchor="middle" dominant-baseline="central">#</text>
      <text class="t-box" x="449" y="389">One number per record</text>
      <text class="t-sub" x="391" y="424">Every case, job and offer gets a</text>
      <text class="t-sub" x="391" y="442">unique, time-stamped id.</text>
      <rect class="inset" x="391" y="454" width="258" height="42" rx="6"/>
      <text class="t-mono" x="403" y="471">0198e2f1-4c7a-7b31-9d02</text>
      <text class="t-mono" x="403" y="487">newest always sorts last</text>

      <!-- TODAY: card 3 -->
      <rect class="card" x="694" y="326" width="306" height="184" rx="10"/>
      <rect class="tab" x="712" y="315" width="112" height="21" rx="5"/>
      <text class="t-tab" x="724" y="330">ADDED TODAY</text>
      <circle class="badge" cx="740" cy="382" r="22"/>
      <circle class="clockface" cx="740" cy="382" r="10"/>
      <line class="clockface" x1="740" y1="382" x2="740" y2="375"/>
      <line class="clockface" x1="740" y1="382" x2="745" y2="385"/>
      <text class="t-box" x="776" y="389">One clock, ours to move</text>
      <text class="t-sub" x="718" y="424">The system asks a clock we hand it,</text>
      <text class="t-sub" x="718" y="442">never the wall clock.</text>
      <rect class="inset" x="718" y="454" width="258" height="42" rx="6"/>
      <text class="t-mono" x="730" y="471">“48 hours later” → 0.001s</text>
      <text class="t-mono" x="730" y="487">deadlines provable pre-launch</text>

      <!-- lower bus: foundation supports today's three -->
      <line class="wire" x1="193" y1="538" x2="193" y2="522" marker-end="url(#up)"/>
      <line class="wire" x1="520" y1="538" x2="520" y2="522" marker-end="url(#up)"/>
      <line class="wire" x1="847" y1="538" x2="847" y2="522" marker-end="url(#up)"/>
      <line class="bus" x1="120" y1="538" x2="920" y2="538"/>
      <text class="t-eyebrow" x="40" y="542">STANDS ON</text>
      <line class="wire" x1="275" y1="576" x2="275" y2="538"/>
      <line class="wire" x1="765" y1="576" x2="765" y2="538"/>

      <!-- FOUNDATION band -->
      <rect class="built" x="40" y="576" width="470" height="90" rx="8"/>
      <text class="t-box" x="64" y="613">Records vault</text>
      <text class="t-sub" x="64" y="636">Postgres, versioned and health-checked</text>
      <text class="t-tag" x="486" y="600" text-anchor="end">DAY 2</text>

      <rect class="built" x="530" y="576" width="470" height="90" rx="8"/>
      <text class="t-box" x="554" y="613">Blueprints &amp; guardrails</text>
      <text class="t-sub" x="554" y="636">written specs, module boundaries, rules</text>
      <text class="t-tag" x="976" y="600" text-anchor="end">DAY 1</text>

      <!-- proof strip -->
      <line class="rule" x1="40" y1="704" x2="1000" y2="704"/>
      <text class="t-stat" x="40" y="742">18/18</text>
      <text class="t-mono" x="128" y="734">automated checks</text>
      <text class="t-mono" x="128" y="748">green, every run</text>

      <text class="t-stat" x="367" y="742">16</text>
      <text class="t-mono" x="412" y="734">written today — these</text>
      <text class="t-mono" x="412" y="748">promises can’t silently break</text>

      <text class="t-stat" x="694" y="742">6s</text>
      <text class="t-mono" x="739" y="734">from clean copy to a</text>
      <text class="t-mono" x="739" y="748">running system</text>
    </svg>
  </div>
  <figcaption>Days 1–2 · nothing here is tenant-facing yet — each layer is built once, and everything above it stands on it.</figcaption>
</figure>
