name: Deploy

# Runs only after CI reports success, so a red commit can never reach staging —
# which also covers direct pushes to main, allowed for admins by branch
# protection.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    name: staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    env:
      PROJECT: dona-v3
      REGION: me-west1
      SERVICE: dona-staging
      IMAGE: me-west1-docker.pkg.dev/dona-v3/dona/app
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run hands us the default-branch tip by default; deploy the
          # commit that actually passed CI.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/149055978002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: deploy-staging@dona-v3.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:staging" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:staging"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:$SHA" \
            --region "$REGION" \
            --service-account "app-staging@$PROJECT.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$PROJECT:$REGION:dona-staging" \
            --set-secrets "DATABASE_URL=staging-database-url:latest,STAFF_SEED_EMAIL=staging-staff-seed-email:latest,STAFF_SEED_PASSWORD=staging-staff-seed-password:latest,STAFF_VIEWER_EMAIL=staging-staff-viewer-email:latest,STAFF_VIEWER_PASSWORD=staging-staff-viewer-password:latest,OPENAI_API_KEY=staging-openai-api-key:latest" \
            --update-env-vars "APP_VERSION=${SHA:0:7},DOCS_BUCKET=$PROJECT-staging-docs" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      # A rollback pins traffic to a named revision, and it stays pinned —
      # the deploy above would then create a revision serving 0%: green
      # pipeline, nothing changed. See docs/runbook-deploy.md.
      - name: Take traffic
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --to-latest --region "$REGION" --quiet

      # "Deployed but silently broken" must fail loudly (PIPELINE.md §5).
      # Same script prod uses, and the same one you can run by hand.
      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          BODY="$(./infra/smoke.sh "$URL")"
          {
            echo "### Staging deployed"
            echo ""
            echo "- URL: $URL"
            echo "- commit: \`$SHA\`"
            echo "- health: \`$BODY\`"
          } >> "$GITHUB_STEP_SUMMARY"
